[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-scheduler-service"
version = "0.1.0"
description = "Lightweight task scheduling service — generated by ai-engineering-orchestrator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111", "pydantic>=2", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
